<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detsh Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #060610;
      --card: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.07);
      --card-hover: rgba(255,255,255,0.09);
      --accent: #3b6fff;
      --accent2: #00e5ff;
      --text: #f0f0f0;
      --muted: #555d72;
      --glow: rgba(59,111,255,0.35);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: -180px; left: -180px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59,111,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: blobMove1 12s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -150px;
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(0,229,255,0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: blobMove2 15s ease-in-out infinite alternate;
    }
    @keyframes blobMove1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,80px) scale(1.15); } }
    @keyframes blobMove2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,-60px) scale(1.1); } }
    .container { width: 100%; max-width: 440px; text-align: center; position: relative; z-index: 1; }
    .profile { margin-bottom: 40px; animation: fadeDown 0.7s ease both; }
    .avatar-wrap { position: relative; width: 100px; height: 100px; margin: 0 auto 18px; }
    .avatar-ring {
      position: absolute; inset: -5px; border-radius: 50%;
      background: conic-gradient(var(--accent), var(--accent2), var(--accent));
      animation: spin 4s linear infinite; opacity: 0.7;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar {
      position: relative; width: 100%; height: 100%;
      border-radius: 50%; background: #0d0d1e;
      overflow: hidden; border: 3px solid var(--bg); z-index: 1;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    h1 {
      font-size: 34px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .tagline { color: var(--muted); margin-top: 8px; font-size: 14px; font-family: 'Space Mono', monospace; letter-spacing: 1px; }
    .links { display: flex; flex-direction: column; gap: 14px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text);
      background: var(--card); border: 1px solid var(--card-border);
      backdrop-filter: blur(12px); padding: 16px 22px; border-radius: 16px;
      font-size: 16px; font-weight: 700;
      transition: transform 0.22s ease, background 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative; overflow: hidden; animation: fadeUp 0.6s ease both;
    }
    .link:nth-child(1) { animation-delay: 0.15s; }
    .link:nth-child(2) { animation-delay: 0.25s; }
    .link:nth-child(3) { animation-delay: 0.35s; }
    .link:nth-child(4) { animation-delay: 0.45s; }
    .link:nth-child(5) { animation-delay: 0.55s; }
    .link::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      transform: translateX(-100%); transition: transform 0.5s ease;
    }
    .link:hover::after { transform: translateX(100%); }
    .link:hover {
      transform: translateY(-3px) scale(1.015);
      background: var(--card-hover);
      border-color: rgba(59,111,255,0.3);
      box-shadow: 0 0 28px var(--glow), 0 8px 24px rgba(0,0,0,0.4);
    }
    .link-icon { font-size: 22px; flex-shrink: 0; width: 32px; text-align: center; }
    .link-text { flex: 1; text-align: left; }
    .link-arrow { font-size: 16px; opacity: 0.3; transition: opacity 0.2s, transform 0.2s; }
    .link:hover .link-arrow { opacity: 0.7; transform: translateX(4px); }
    .footer { margin-top: 36px; color: var(--muted); font-size: 13px; font-family: 'Space Mono', monospace; animation: fadeUp 0.6s 0.65s ease both; }
    .footer span { color: var(--accent); }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
